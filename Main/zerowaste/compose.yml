services:
  # zerowaste – API + UI in one container.
  # Users open the UI port. The API port is only for frontend requests and docs.
  zerowaste:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${UI_PORT:-8511}:8501"    # App öffnen: http://localhost:8511/
      - "${API_PORT:-8001}:8000"   # API docs:   http://localhost:8001/docs
    volumes:
      - "${DATA_DIR:-./data}:/app/data"   # SQLite DB + conversation.jsonp logs
      - "./chatbot:/app"                   # live-reload chatbot code in dev
      - "./frontend:/app/frontend"         # live-reload frontend in dev
    environment:
      - ACADEMIC_CLOUD_API_KEY=90718c8494d63cf613bd4a4d62534b3b
      - ACADEMIC_CLOUD_BASE_URL=${ACADEMIC_CLOUD_BASE_URL:-https://chat-ai.academiccloud.de/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3-30b-a3b-instruct-2507}
      - API_BASE_URL=${API_BASE_URL:-http://localhost}
      - API_PORT=${API_PORT:-8001}
      - UI_PORT=${UI_PORT:-8511}
      - DATA_DIR=/app/data
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  default:
    driver: bridge
