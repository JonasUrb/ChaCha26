services:
  zerowaste-bot:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${API_PORT:-8001}:8000"
      - "${UI_PORT:-8502}:8501"
    volumes:
      - "${DATA_DIR:-./data}:/app/data"
      - "./:/app"

    environment:
      - ACADEMIC_CLOUD_API_KEY=${ACADEMIC_CLOUD_API_KEY}
      - ACADEMIC_CLOUD_BASE_URL=${ACADEMIC_CLOUD_BASE_URL:-https://chat-ai.academiccloud.de/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3-30b-a3b-instruct-2507}
      - API_BASE_URL=${API_BASE_URL:-http://localhost}
      - API_PORT=${API_PORT:-8001}
      - UI_PORT=${UI_PORT:-8502}
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  default:
    driver: bridge