services:
  zerowaste-bot:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Datenbank bleibt persistent, auch nach Container-Neustart
      - ./data:/app/data
    environment:
      - ACADEMIC_CLOUD_API_KEY=7f77f99acf0c2a6ee146e1a173fd0b84
      - ACADEMIC_CLOUD_BASE_URL=${ACADEMIC_CLOUD_BASE_URL:-https://chat-ai.academiccloud.de/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3-30b-a3b-instruct-2507}
    restart: unless-stopped
